<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Procedural archival poster</title>
  <desc id="d">Dark parchment-toned backdrop with a film-reel line motif.</desc>
  <defs>
    <radialGradient id="p-bg" cx="0.5" cy="0.4" r="1">
      <stop offset="0" stop-color="#1c1a16"/>
